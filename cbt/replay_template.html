<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Tracking Replay</title>
<style>
  :root { --bar: rgba(12, 20, 30, 0.86); --ink: #f4f6f8; --muted: #9fb0c0; --accent: #1f9d55; }
  html, body { margin: 0; height: 100%; background: #0b1218; overflow: hidden;
    font-family: "Segoe UI", Inter, Roboto, Arial, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #overlay { pointer-events: none; }
  #controls { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center;
    background: var(--bar); padding: 8px 10px; border-radius: 12px; color: var(--ink);
    font-size: 13px; max-width: calc(100vw - 32px); box-sizing: border-box; z-index: 5; }
  #controls .grp { display: flex; gap: 4px; align-items: center; padding: 0 6px;
    border-left: 1px solid rgba(255,255,255,0.12); }
  #controls .grp:first-child { border-left: 0; }
  #controls .lbl { color: var(--muted); margin-right: 2px; }
  button { background: rgba(255,255,255,0.08); color: var(--ink); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 7px; padding: 5px 9px; font: inherit; cursor: pointer; }
  button:hover { background: rgba(255,255,255,0.16); }
  button.on { background: var(--accent); border-color: var(--accent); }
  button.rec { background: #b3261e; border-color: #b3261e; }
  #hint { position: fixed; right: 14px; bottom: 14px; color: var(--muted); font-size: 12px; z-index: 4; }
  body.capture #controls, body.capture #hint { display: none; }
  @media (max-width: 700px) { #hint { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="controls">
  <div class="grp"><button id="replay">▶ Replay</button></div>
  <div class="grp"><span class="lbl">Speed</span>
    <button data-speed="1">1×</button><button data-speed="0.5">½×</button><button data-speed="0.25" class="on">¼×</button></div>
  <div class="grp"><span class="lbl">Camera</span>
    <button data-cam="auto" class="on">Auto</button><button data-cam="broadcast">Broadcast</button>
    <button data-cam="umpire">Umpire</button><button data-cam="side">Side-on</button>
    <button data-cam="stumps">Stumps</button><button data-cam="top">Pitch map</button></div>
  <div class="grp"><span class="lbl">On-field</span>
    <button data-onfield="not out">Not out</button><button data-onfield="out">Out</button></div>
  <div class="grp"><span class="lbl">Shot offered</span>
    <button data-shot="1">Yes</button><button data-shot="0">No</button></div>
  <div class="grp" id="truthgrp"><button id="truth">Ground truth</button></div>
  <div class="grp"><button id="record">● Record video</button></div>
</div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script type="application/json" id="data">__DATA__</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
(THREE.Object3D.DEFAULT_UP || THREE.Object3D.DefaultUp).set(0, 0, 1);          // world frame: x across, y along pitch, z up
const V = (a) => new THREE.Vector3(a[0], a[1], a[2]);
const lerp = (a, b, s) => a + (b - a) * s;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const SGN = D.handed === "left" ? -1 : 1;        // +x = off side for a right-hander
const L = 20.12, BALL_R = 0.036, STUMP_R = 0.018, STUMP_H = 0.711, STUMP_HW = 0.1143;

// ---------------------------------------------------------------- renderer
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);
const overlay = document.createElement("canvas");
overlay.id = "overlay";
stage.appendChild(overlay);
const og = overlay.getContext("2d");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec6e4);
scene.fog = new THREE.Fog(0x9ec6e4, 90, 260);
const camera = new THREE.PerspectiveCamera(10, 16 / 9, 0.05, 600);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 6, 0.5);

scene.add(new THREE.HemisphereLight(0xe8f2ff, 0x3f5f33, 0.65));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.25);
sun.position.set(-18, 14, 30);
sun.target.position.set(0, 8, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 16, bottom: -16, near: 1, far: 90 });
sun.shadow.bias = -0.0004;
scene.add(sun, sun.target);

// ---------------------------------------------------------------- ground + pitch
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const R = rnd(7);

const grassTex = canvasTex(512, 512, (g, w, h) => {
  for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? "#3f8a3a" : "#4a9844"; g.fillRect(0, i * h / 8, w, h / 8); }
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = `rgba(${20 + R() * 40},${60 + R() * 60},${20 + R() * 30},0.18)`;
    g.fillRect(R() * w, R() * h, 2, 2);
  }
}, [12, 12]);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240),
  new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 }));
ground.position.set(0, 10, 0);
ground.receiveShadow = true;
scene.add(ground);

const pitchTex = canvasTex(256, 2048, (g, w, h) => {
  g.fillStyle = "#cdb98a"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40000; i++) {
    const v = R();
    g.fillStyle = v < 0.5 ? "rgba(120,96,60,0.10)" : "rgba(255,245,220,0.10)";
    g.fillRect(R() * w, R() * h, 1 + R() * 2, 1 + R() * 2);
  }
  // worn areas in front of each popping crease (bowlers' footmarks / batters' guard)
  for (const yc of [0.10, 0.90]) {
    const grd = g.createRadialGradient(w / 2, yc * h, 5, w / 2, yc * h, h * 0.07);
    grd.addColorStop(0, "rgba(140,110,70,0.35)"); grd.addColorStop(1, "rgba(140,110,70,0)");
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
  }
  // faint grass at the edges of the strip
  const e = g.createLinearGradient(0, 0, w, 0);
  e.addColorStop(0, "rgba(90,140,70,0.35)"); e.addColorStop(0.08, "rgba(90,140,70,0)");
  e.addColorStop(0.92, "rgba(90,140,70,0)"); e.addColorStop(1, "rgba(90,140,70,0.35)");
  g.fillStyle = e; g.fillRect(0, 0, w, h);
});
const pitch = new THREE.Mesh(new THREE.PlaneGeometry(3.05, 24.4),
  new THREE.MeshStandardMaterial({ map: pitchTex, roughness: 0.95 }));
pitch.position.set(0, L / 2, 0.002);
pitch.receiveShadow = true;
scene.add(pitch);

const lineMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });
function line(x0, y0, x1, y1, w = 0.05) {
  const len = Math.hypot(x1 - x0, y1 - y0);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(len, w), lineMat);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, 0.004);
  m.rotation.z = Math.atan2(y1 - y0, x1 - x0);
  m.receiveShadow = true;
  scene.add(m);
}
for (const [yb, s] of [[0, 1], [L, -1]]) {
  line(-1.32, yb, 1.32, yb);                                  // bowling crease
  line(-1.83, yb + s * 1.22, 1.83, yb + s * 1.22);            // popping crease
  for (const x of [-1.32, 1.32]) line(x, yb - s * 1.22, x, yb + s * 1.22);   // return creases
}

// ---------------------------------------------------------------- stumps + bails
const stumpMat = new THREE.MeshStandardMaterial({ color: 0xf1e6cc, roughness: 0.5 });
function stumpsAt(y) {
  const g = new THREE.Group(), stumps = [], bails = [];
  for (const x of [-(STUMP_HW - STUMP_R), 0, STUMP_HW - STUMP_R]) {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(STUMP_R, STUMP_R, STUMP_H, 20), stumpMat.clone());
    s.rotation.x = Math.PI / 2; s.position.set(x, 0, STUMP_H / 2);
    s.castShadow = true; g.add(s); stumps.push(s);
  }
  for (const x of [-(STUMP_HW - STUMP_R) / 2, (STUMP_HW - STUMP_R) / 2]) {
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.108, 12), stumpMat.clone());
    b.rotation.z = Math.PI / 2; b.position.set(x, 0, STUMP_H + 0.008);
    b.castShadow = true; g.add(b); bails.push(b);
  }
  g.position.set(0, y, 0);
  scene.add(g);
  return { g, stumps, bails };
}
const striker = stumpsAt(0), bowlerEnd = stumpsAt(L);

// ---------------------------------------------------------------- batter
const KIT = { whites: 0xf2efe6, pads: 0xfbfbfb, helmet: 0x0d5a3c, skin: 0x8a5a3c, shoe: 0x22262b,
              grip: 0x1d1d1d, blade: 0xd9bf8a, glove: 0xf5f5f5 };
const mat = (c, r = 0.7) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
const batter = new THREE.Group(); scene.add(batter);
function limb(radTop, radBot, m) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radTop, radBot, 1, 18), m);
  mesh.castShadow = true; batter.add(mesh); return mesh;
}
const UPY = new THREE.Vector3(0, 1, 0);
function place(mesh, a, b) {      // stretch a unit cylinder from point a (bottom) to b (top)
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(UPY, d.normalize());
  mesh.scale.set(1, len, 1);
}
function ball(r, m) { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 16), m); s.castShadow = true; batter.add(s); return s; }
const P = {
  padF: limb(0.072, 0.078, mat(KIT.pads, 0.6)), padB: limb(0.072, 0.078, mat(KIT.pads, 0.6)),
  thighF: limb(0.085, 0.075, mat(KIT.whites)), thighB: limb(0.085, 0.075, mat(KIT.whites)),
  kneeF: ball(0.08, mat(KIT.pads, 0.6)), kneeB: ball(0.08, mat(KIT.pads, 0.6)),
  hip: ball(0.16, mat(KIT.whites)),
  torso: new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.34, 8, 20), mat(KIT.whites)),
  upperF: limb(0.05, 0.045, mat(KIT.whites)), upperB: limb(0.05, 0.045, mat(KIT.whites)),
  foreF: limb(0.042, 0.038, mat(KIT.whites)), foreB: limb(0.042, 0.038, mat(KIT.whites)),
  elbowF: ball(0.044, mat(KIT.whites)), elbowB: ball(0.044, mat(KIT.whites)),
  gloveF: ball(0.055, mat(KIT.glove, 0.8)), gloveB: ball(0.055, mat(KIT.glove, 0.8)),
  neck: limb(0.05, 0.055, mat(KIT.skin)),
  face: ball(0.1, mat(KIT.skin)), helmet: ball(0.125, mat(KIT.helmet, 0.35)),
  handle: limb(0.017, 0.017, mat(KIT.grip, 0.9)),
};
P.torso.castShadow = true; batter.add(P.torso);
P.helmet.scale.set(1, 1, 0.85);
const peak = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.09, 0.012), mat(KIT.helmet, 0.35));
peak.castShadow = true; batter.add(peak);
const grille = new THREE.Group(); batter.add(grille);
for (let i = 0; i < 3; i++) {
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.2, 8), mat(0x6f7780, 0.4));
  bar.rotation.z = Math.PI / 2; bar.position.set(0, 0, -0.035 * i); grille.add(bar);
}
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.108, 0.045, 0.56), mat(KIT.blade, 0.55));
blade.castShadow = true; batter.add(blade);
const shoes = [0, 1].map(() => {
  const shoe = new THREE.Group();
  const upper = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), mat(KIT.shoe, 0.65));
  upper.scale.set(0.058, 0.14, 0.046);
  upper.castShadow = true;
  const sole = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), mat(0xdad8d1));
  sole.scale.set(0.059, 0.143, 0.014);
  sole.position.z = -0.032;
  shoe.add(upper, sole);
  batter.add(shoe);
  return shoe;
});

// Tapered pads with raised channels and rear straps. The details follow the posed shin.
const padRib = mat(0xf2f2ee, 0.76), strapMat = mat(0xc9cccf);
for (const pad of [P.padF, P.padB]) {
  for (const x of [-0.038, 0, 0.038]) {
    const rib = new THREE.Mesh(new THREE.CapsuleGeometry(0.009, 0.70, 4, 8), padRib);
    rib.position.set(x, 0, x ? -0.068 : -0.077);
    pad.add(rib);
  }
  for (const y of [-0.27, 0.25]) {
    const strap = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.047, 0.018), strapMat);
    strap.position.set(0, y, 0.057);
    pad.add(strap);
  }
}
const shoulder = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 12), mat(KIT.whites));
shoulder.scale.set(0.158, 0.195, 0.09);
shoulder.castShadow = true;
batter.add(shoulder);
const waist = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), mat(0xe4e2d9));
waist.scale.set(0.146, 0.162, 0.065);
batter.add(waist);
const bladeSticker = new THREE.Mesh(new THREE.PlaneGeometry(0.061, 0.12), mat(0x28564a));
bladeSticker.rotation.x = -Math.PI / 2;
bladeSticker.position.set(0, 0.023, -0.08);
blade.add(bladeSticker);

// pose: the struck pad ends exactly where the tracker says the ball hit
const IMP = V(D.impact.p);
const frontFootShot = IMP.z < 0.75 ? IMP.y >= 0.95 : true;
function sx(x) { return SGN * x; }   // local "towards off side" -> world x
function solveKnee(ankle, hip, bendDir, seg = 0.47) {
  const mid = ankle.clone().add(hip).multiplyScalar(0.5);
  const d = ankle.distanceTo(hip);
  const bend = d < 2 * seg ? Math.sqrt(seg * seg - (d / 2) * (d / 2)) : 0;
  const axis = new THREE.Vector3().subVectors(hip, ankle).normalize();
  const b = bendDir.clone().addScaledVector(axis, -bendDir.dot(axis)).normalize();
  return mid.addScaledVector(b, bend);
}
function poseBatter(p) {
  const s = ease(p);
  // final foot positions
  let fF, fB;
  const padOff = 0.078 + BALL_R;                      // pad surface touches the ball
  if (frontFootShot) {
    fF = new THREE.Vector3(IMP.x, IMP.y - padOff, 0);
    fB = new THREE.Vector3(IMP.x - sx(0.10), Math.max(0.35, IMP.y - 0.85), 0);
  } else {
    fB = new THREE.Vector3(IMP.x, IMP.y - padOff, 0);
    fF = new THREE.Vector3(IMP.x - sx(0.06), fB.y + 0.55, 0);
  }
  // guard stance (feet either side of the popping crease)
  const gF = new THREE.Vector3(sx(0.02), 1.30, 0), gB = new THREE.Vector3(sx(0.04), 0.82, 0);
  const F = gF.lerp(fF, s), B = gB.lerp(fB, s);
  const stride = Math.max(0, F.y - B.y - 0.45);
  const H = F.clone().add(B).multiplyScalar(0.5);
  H.x -= sx(0.06); H.z = 0.93 - 0.35 * stride * stride;
  const hipF = H.clone().add(new THREE.Vector3(0, 0.09, 0)), hipB = H.clone().add(new THREE.Vector3(0, -0.09, 0));
  const ankF = F.clone().setZ(0.09), ankB = B.clone().setZ(0.09);
  const kneeF = solveKnee(ankF, hipF, new THREE.Vector3(sx(0.3), 1, 0.2));
  const kneeB = solveKnee(ankB, hipB, new THREE.Vector3(sx(1), 0.2, 0.2));
  place(P.padF, ankF, kneeF.clone().add(new THREE.Vector3(0, 0, 0.06)));
  place(P.padB, ankB, kneeB.clone().add(new THREE.Vector3(0, 0, 0.06)));
  place(P.thighF, kneeF, hipF); place(P.thighB, kneeB, hipB);
  P.kneeF.position.copy(kneeF).add(new THREE.Vector3(sx(0.02), 0.02, 0.04));
  P.kneeB.position.copy(kneeB).add(new THREE.Vector3(sx(0.02), 0.02, 0.04));
  shoes[0].position.set(F.x + sx(0.03), F.y + 0.05, 0.04); shoes[0].rotation.z = -SGN * 0.6 * s;
  shoes[1].position.set(B.x + sx(0.05), B.y, 0.04); shoes[1].rotation.z = -SGN * Math.PI / 2;
  P.hip.position.copy(H).setZ(H.z + 0.02); P.hip.scale.set(1.05, 1.2, 0.9);
  // torso leans towards the bowler as the stride lands
  const S = H.clone().add(new THREE.Vector3(sx(0.04), 0.06 + 0.16 * s, 0.50 - 0.04 * s));
  place(P.torso, H.clone().setZ(H.z + 0.06), S);
  P.torso.scale.set(0.95, 0.92, 1.05);
  shoulder.position.copy(S).add(new THREE.Vector3(0, 0, 0.028));
  waist.position.copy(H).add(new THREE.Vector3(0, 0.015, 0.14));
  const shF = S.clone().add(new THREE.Vector3(0, 0.17, 0.08)), shB = S.clone().add(new THREE.Vector3(0, -0.17, 0.08));
  const neckTop = S.clone().add(new THREE.Vector3(0, 0.03, 0.2));
  place(P.neck, S.clone().setZ(S.z + 0.08), neckTop);
  const head = neckTop.clone().add(new THREE.Vector3(sx(0.0), 0.04, 0.1));
  P.face.position.copy(head).add(new THREE.Vector3(0, 0.012, 0));
  P.helmet.position.copy(head).add(new THREE.Vector3(0, -0.012, 0.03));
  peak.position.copy(head).add(new THREE.Vector3(0, 0.12, 0.08)); peak.rotation.x = -0.25;
  grille.position.copy(head).add(new THREE.Vector3(0, 0.115, -0.02));
  grille.rotation.x = -0.13;
  // hands together in front of the body, bat angled down past the front pad
  const lift = Math.sin(Math.PI * s) * 0.10;
  const hands = H.clone().add(new THREE.Vector3(sx(0.27 + 0.03 * s), 0.10 + 0.12 * s, 0.05 - 0.05 * s + lift));
  const elbF = shF.clone().lerp(hands, 0.5).add(new THREE.Vector3(sx(0.10), 0.05, -0.03));
  const elbB = shB.clone().lerp(hands, 0.5).add(new THREE.Vector3(sx(0.12), -0.02, -0.06));
  place(P.upperF, elbF, shF); place(P.foreF, hands, elbF);
  place(P.upperB, elbB, shB); place(P.foreB, hands, elbB);
  P.elbowF.position.copy(elbF);
  P.elbowB.position.copy(elbB);
  P.gloveF.position.copy(hands).add(new THREE.Vector3(0, 0, 0.05));
  P.gloveB.position.copy(hands).add(new THREE.Vector3(0, 0, -0.05));
  const top = hands.clone().add(new THREE.Vector3(0, 0, 0.12));
  const toe = new THREE.Vector3(hands.x + sx(0.02), hands.y + 0.10 * s - 0.05, 0.05 + 0.08 * (1 - s));
  const dir = new THREE.Vector3().subVectors(toe, top).normalize();
  const hb = top.clone().addScaledVector(dir, 0.28);
  place(P.handle, hb, top);
  blade.position.copy(hb).addScaledVector(dir, 0.28);
  blade.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, -1), dir);
}

const batterMats = [];
batter.traverse((o) => { if (o.isMesh) { o.material = o.material.clone(); batterMats.push(o.material); } });
function setBatterOpacity(a) {
  const tr = a < 0.999;
  for (const m of batterMats) {
    if (m.transparent !== tr) { m.transparent = tr; m.depthWrite = !tr; m.needsUpdate = true; }
    m.opacity = a;
  }
}

// ---------------------------------------------------------------- ball, trails, markers
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 32, 20),
  new THREE.MeshStandardMaterial({ color: 0xa3121b, roughness: 0.42, metalness: 0.05 }));
ballMesh.castShadow = true; scene.add(ballMesh);
const seam = new THREE.Mesh(new THREE.TorusGeometry(BALL_R * 1.002, 0.0028, 6, 40),
  new THREE.MeshStandardMaterial({ color: 0xf2e8d8, roughness: 0.6 }));
ballMesh.add(seam);
const ghost = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0x2e7bd6, transparent: true, opacity: 0.75, roughness: 0.3 }));
scene.add(ghost);

function trail(points, color, opacity) {
  const curve = new THREE.CatmullRomCurve3(points.map(V));
  const segs = Math.max(8, points.length - 1);
  const geo = new THREE.TubeGeometry(curve, segs, BALL_R * 0.95, 14, false);
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, transparent: true, opacity,
    roughness: 0.5, emissive: color, emissiveIntensity: 0.55, depthWrite: false }));
  m.userData.perSeg = 14 * 6; m.userData.segs = segs;
  // the tube is laid out by arc length; samples are uniform in time -> map index to arc fraction
  const cum = [0];
  for (let k = 1; k < points.length; k++) cum.push(cum[k - 1] + V(points[k]).distanceTo(V(points[k - 1])));
  m.userData.cum = cum.map((c) => c / (cum[cum.length - 1] || 1));
  geo.setDrawRange(0, 0);
  scene.add(m);

// ---------------------------------------------------------------- decision logic
const rep = D.report;
function verdictColour(field, value) {
  if (value === "inconclusive") return "grey";
  if (value === "umpires call") return "amber";
  if (field === "pitching") return value === "outside leg" ? "green" : "red";
  if (field === "impact") return value === "in line" ? "red" : "green";
  if (field === "wickets") return value === "hitting" ? "red" : "green";
}
// mirrors cbt/lbw.py decide() -- keep the two in step
const Q = new URLSearchParams(location.search);
const ctx = {
  onField: Q.get("onfield") || rep.on_field || "not out",
  shot: Q.has("shot") ? Q.get("shot") !== "0" : (rep.shot_offered !== undefined ? rep.shot_offered : true),
};
/*__DECISIONS__*/
function finalDecision() {
  const d = reviewDecision(rep, ctx.onField, ctx.shot);
  const word = d.decision.toUpperCase();
  if (rep.wickets === "inconclusive")
    return ["NO DECISION", "grey", `insufficient tracking data · on-field ${word} stands`, d];
  if (d.umpiresCall) return ["UMPIRE'S CALL", "amber", `${word} · on-field decision stands · ${d.reason}`, d];
  return [word, d.decision === "out" ? "red" : "green", d.reason, d];
}
let FINAL = finalDecision();

// ---------------------------------------------------------------- timeline
let speed = 0.25;
const T_IMP = D.impact.t, T_PROJ = D.proj.t.length ? D.proj.t[D.proj.t.length - 1] : 0;
function timeline() {
  const intro = 0.9, flight = T_IMP / speed, hold = 1.1, proj = Math.max(T_PROJ / speed, 0.4), pre = 0.6;
  const t0 = 0, t1 = intro, t2 = t1 + flight, t3 = t2 + hold, t4 = t3 + proj, t5 = t4 + pre;
  return { t1, t2, t3, t4, t5, end: t5 + 4 * 0.75 + 3.2 };
}
let TL = timeline();
function interpPath(path, t) {
  const ts = path.t, ps = path.p;
  if (t <= ts[0]) return { i: 0, p: V(ps[0]) };
  if (t >= ts[ts.length - 1]) return { i: ts.length - 1, p: V(ps[ps.length - 1]) };
  let lo = 0, hi = ts.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ts[m] <= t) lo = m; else hi = m; }
  const s = (t - ts[lo]) / (ts[hi] - ts[lo]);
  return { i: lo + s, p: V(ps[lo]).lerp(V(ps[hi]), s) };
}

  const frac = k + 1 < c.length ? lerp(c[k], c[k + 1], r) : c[c.length - 1];
  const segs = Math.floor(clamp01(frac) * m.userData.segs);

}

// ---------------------------------------------------------------- cameras
const CAMS = {
  broadcast: { pos: [0, L + 32, 6.2], tgt: [0, 8.0, 1.0], fov: 8.2 },
  umpire:    { pos: [0.25, L + 1.4, 1.75], tgt: [0, 2.0, 0.45], fov: 16 },
  side:      { pos: [sx(17), 9.5, 2.2], tgt: [0, 9.0, 0.7], fov: 38 },
  stumps:    { pos: [sx(1.9), 6.5, 1.15], tgt: [0, 0.4, 0.42], fov: 22 },
  top:       { pos: [0, 9.5, 34], tgt: [0, 9.6, 0], fov: 40 },
  wickets:   { pos: [sx(0.15), 8.8, 1.30], tgt: [0, 0.15, 0.42], fov: 15 },
  finale:    { pos: [sx(2.3), 5.2, 1.20], tgt: [0, 0.25, 0.40], fov: 21 },

const PUSH = { pos: [0, L + 26, 4.6], tgt: [0, 3.0, 0.6], fov: 7.2 };

// ---------------------------------------------------------------- frame
function renderAt(t) {

  let ballP, inFlight = t < TL.t2;

  bounceMark.visible = tauF >= D.bounce.t;
  bounceMark.scale.setScalar(bounceMark.visible ? 1 + 0.6 * Math.max(0, 1 - (tauF - D.bounce.t) * 4) : 1);
  const relA = 1 - clamp01((t - TL.t1 - 0.6) / 0.6);

  impactRing.material.transparent = true;

  const tauP = clamp01((t - TL.t3) / (TL.t4 - TL.t3)) * T_PROJ;
  ghost.visible = t >= TL.t3 && projected;

    const g = interpPath(D.proj, tauP);
    setTrail(projected, t >= TL.t3 ? g.i : 0);

  }

  unc.material.opacity = t >= TL.t4 && D.stumps_xz.every(Number.isFinite) ? 0.9 : 0;

    hitT > 0 && hitting ? 0xff5a4f : hitT > 0 && clipping ? 0xffc24a : 0xf1e6cc));

}

// record: composite the 3D canvas and the overlay into one stream
document.getElementById("record").onclick = (e) => {
  const btn = e.target;
  const comp = document.createElement("canvas");
  comp.width = overlay.width; comp.height = overlay.height;
  const cg = comp.getContext("2d");
  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const type = types.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  if (!type) { alert("This browser cannot record video. Use Chrome or Edge."); return; }
  const rec = new MediaRecorder(comp.captureStream(30), { mimeType: type, videoBitsPerSecond: 12e6 });
  const chunks = [];
  rec.ondataavailable = (ev) => chunks.push(ev.data);
  rec.onstop = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = `ball-tracking-replay.${type.includes("mp4") ? "mp4" : "webm"}`;
    a.click(); btn.classList.remove("rec"); btn.textContent = "● Record video";
  };
  restart(); rec.start(); btn.classList.add("rec"); btn.textContent = "■ Recording…";
  const pump = () => {
    cg.drawImage(renderer.domElement, 0, 0, comp.width, comp.height);
    cg.drawImage(overlay, 0, 0);
    if (clock < TL.end) requestAnimationFrame(pump); else rec.stop();
  };
  pump();
};

window.REPLAY = { renderAt, decide, ctx, get final() { return FINAL; }, get duration() { return TL.end; }, get timeline() { return TL; }, setSpeed: (s) => { speed = s; TL = timeline(); },
                  setCam: setCamMode };
if (!CAPTURE) loop(); else { setCamMode("auto"); renderAt(0); }
</script>
</body>
